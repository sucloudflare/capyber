name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# privilégio mínimo para o GITHUB_TOKEN
permissions:
  contents: read

# cancela execuções antigas da mesma branch/PR
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "file:../db/ci.db"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck + Lint + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # o client do Prisma precisa existir ANTES do tsc (db.session, db.user…)
      - name: Prisma generate
        run: bunx prisma generate

      - name: Typecheck (tsc --noEmit)
        run: bun run typecheck

      - name: Lint (ESLint)
        run: bun run lint

      # o engine não tem typescript próprio: reaproveita o da raiz (bun-types + socket.io)
      - name: Typecheck (threat-engine)
        run: bunx tsc --noEmit -p mini-services/threat-engine/tsconfig.json

      - name: Build (Next.js)
        run: bun run build

  security:
    name: Security audit (dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # auditoria de vulnerabilidades conhecidas (OSV) nos manifestos do app e do
      # mini-serviço. Informativo (não bloqueia o merge): os achados aparecem no log.
      - name: osv-scanner (bun.lock + threat-engine)
        uses: google/osv-scanner-action/osv-scanner-action@v2
        with:
          scan-args: |-
            --lockfile=./bun.lock
            --lockfile=./mini-services/threat-engine/bun.lock
        continue-on-error: true
